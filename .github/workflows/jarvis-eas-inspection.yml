name: JARVIS EAS Build Inspection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jarvis-eas-inspection.yml'
      - 'scripts/inspect-eas-build.mjs'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Read latest Android build
        if: env.EXPO_TOKEN != ''
        working-directory: jarvis-2-android
        run: |
          eas build:list --platform android --limit 1 --json --non-interactive > eas-status.json
          node ../scripts/inspect-eas-build.mjs eas-status.json
