name: JARVIS Android Artifact Verification

on:
  workflow_run:
    workflows: ['JARVIS Android APK']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed Android build run (empty selects latest success)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/jarvis-android-artifact.yml'
      - 'scripts/verify-android-artifact.mjs'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Resolve source build
        id: source
        uses: actions/github-script@v8
        env:
          REQUESTED_RUN: ${{ inputs.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifactFor = async (run) => {
              const result = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id, per_page: 100});
              return result.data.artifacts.find(artifact => !artifact.expired && artifact.name === 'JARVIS-2.0-Android-' + run.head_sha);
            };
            let run = context.payload.workflow_run;
            let artifact;
            if (process.env.REQUESTED_RUN) {
              run = (await github.rest.actions.getWorkflowRun({owner, repo, run_id: Number(process.env.REQUESTED_RUN)})).data;
            }
            if (run) {
              if (run.status !== 'completed' || run.conclusion !== 'success' || run.head_branch !== 'main') throw new Error('A successful main-branch build is required.');
              artifact = await artifactFor(run);
              if (!artifact) throw new Error('The selected run has no downloadable Android artifact.');
            } else {
              const result = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'jarvis-android.yml', branch: 'main', status: 'success', per_page: 10});
              for (const candidate of result.data.workflow_runs) {
                artifact = await artifactFor(candidate);
                if (artifact) { run = candidate; break; }
              }
            }
            if (!run) { core.notice('No downloadable Android build is available yet. Verification will run when it completes.'); return; }
            core.setOutput('artifact_name', artifact.name);
            const file = (await github.rest.repos.getContent({owner, repo, path: 'jarvis-2-android/app.json', ref: run.head_sha})).data;
            const config = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8')).expo;
            core.setOutput('run_id', String(run.id));
            core.setOutput('sha', run.head_sha);
            core.setOutput('package', config.android.package);
            core.setOutput('version', config.version);
            core.setOutput('version_code', String(config.android.versionCode));
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          path: artifacts
      - uses: actions/setup-java@v5
        if: steps.source.outputs.run_id != ''
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.source.outputs.run_id != ''
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify Android archive and signature
        if: steps.source.outputs.run_id != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_PACKAGE: ${{ steps.source.outputs.package }}
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.source.outputs.version_code }}
        run: |
          sdkmanager 'build-tools;36.0.0'
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs JARVIS-2.0-preview.apk > signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging JARVIS-2.0-preview.apk > apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree JARVIS-2.0-preview.apk AndroidManifest.xml > manifest-tree.txt
          node ../scripts/verify-android-artifact.mjs
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.run_id != ''
        with:
          name: Android-verification-${{ steps.source.outputs.sha }}
          path: |
            artifacts/verification.json
            artifacts/signature.txt
            artifacts/apk-info.txt
            artifacts/manifest-tree.txt
          if-no-files-found: error
          retention-days: 30
